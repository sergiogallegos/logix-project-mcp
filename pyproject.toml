[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "logix-project-mcp"
version = "0.1.0"
description = "Local MCP server for saved Studio 5000 Logix Designer projects"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["anyio>=4.5,<5", "defusedxml>=0.7.1,<1", "mcp>=1.30,<2", "pydantic>=2.11,<3"]

[project.scripts]
logix-project-mcp = "logix_project_mcp.server:main"
logix-project-mcp-doctor = "logix_project_mcp.doctor:main"
logix-project-mcp-share = "logix_project_mcp.share:main"
logix-project-mcp-menu = "logix_project_mcp.custom_tools:main"
logix-project-mcp-review = "logix_project_mcp.review:main"
logix-project-mcp-review-tag = "logix_project_mcp.tag_edits:main"
logix-project-mcp-review-routine = "logix_project_mcp.routine_edits:main"
logix-project-mcp-review-native = "logix_project_mcp.native_review:main"
logix-project-mcp-check-build = "logix_project_mcp.build_check:main"
